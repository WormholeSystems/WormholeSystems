[package]
name = "wormholesystems-desktop"
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT"
description = "Maps scans and jumps from shortcuts, with an overlay above the game"

# Its own workspace: GPUI wants system libraries the server's builds and CI have no use for.
[workspace]

[[bin]]
name = "wormholesystems"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
cargo-packager-updater = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
global-hotkey = "0.9"
gpui-kit = "0.7.3"
resvg = { version = "0.46", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
ureq = { version = "3.4", features = ["json", "platform-verifier"] }

# Whether a tray is there to put the icon in.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# The overlay window: click-through, above the game.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6.2"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

# cargo-packager, run by CI after the release build (.github/workflows/desktop.yml).
[package.metadata.packager]
product-name = "WormholeSystems"
identifier = "systems.wormhole.desktop"
category = "Utility"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
    "assets/icons/512x512.png",
    "assets/icon.ico",
]

# Ad-hoc: Apple silicon will not run unsigned code at all.
[package.metadata.packager.macos]
signing-identity = "-"
