# Standalone: only the API and the frontend, for a machine that already has a Postgres and
# a reverse proxy. No `db` and no `caddy` here; the app joins an existing Docker network
# under fixed names, and whatever proxies the domain sends traffic to them there.
#
# What wsctl 0.5 wrote into COMPOSE_FILE for a standalone install. wsctl 0.6 spells the same
# stack as docker-compose.yml with deploy/external-db.yml and deploy/app-network.yml, and
# `wsctl update` moves .env over; this stays so an install that still names it (or an
# older wsctl) keeps working until then.
services:
  api:
    extends:
      file: docker-compose.yml
      service: api
    # The full stack waits for its own Postgres; here the database is somebody else's.
    depends_on: !reset {}
    environment:
      DATABASE_URL: ${WS_DATABASE_URL:?WS_DATABASE_URL is not set, run wsctl setup}
    networks:
      default:
      proxy:
        aliases: [wormholesystems-api]

  web:
    extends:
      file: docker-compose.yml
      service: web
    environment:
      # Not plain `api`: on a shared network other stacks answer to that name too.
      API_BASE: http://wormholesystems-api:3000
    networks:
      default:
      proxy:
        aliases: [wormholesystems-web]

networks:
  # Made by `wsctl setup` when it does not exist yet, so a proxy container can join it.
  proxy:
    name: ${WS_PROXY_NETWORK:-wormholesystems}
    external: true

volumes:
  sde:
  uploads:
