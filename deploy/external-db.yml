# The database is one you already run: no `db` container, and the API connects to
# WS_DATABASE_URL instead. Picked by WS_DATABASE=external.
#
# Every file in this directory is an overlay on docker-compose.yml. `wsctl setup` and
# `wsctl update` put the ones an install needs into COMPOSE_FILE in .env, so every plain
# `docker compose` command reads the same stack wsctl does.
services:
  db:
    # A profile nothing turns on is how an overlay takes a service out. A db container left
    # from before keeps running until `docker compose rm -sf db`.
    profiles: [bundled-db]

  api:
    depends_on: !reset {}
    environment:
      DATABASE_URL: ${WS_DATABASE_URL:?WS_DATABASE_URL is not set, run wsctl setup}

  # Dumps the same database the API uses.
  backup:
    depends_on: !reset {}
    environment:
      DATABASE_URL: ${WS_DATABASE_URL:?WS_DATABASE_URL is not set, run wsctl setup}
