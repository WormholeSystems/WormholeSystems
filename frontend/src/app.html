<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- The bar the browser paints around the page, per theme. -->
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="WormholeSystems" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- The mark is a single colour, so it needs one per theme or it disappears on half
		     of them. The SVG carries both and chooses inside itself, which works wherever an
		     SVG icon does; the PNGs behind it rely on the browser honouring `media` on the
		     link, which not all of them do. So the unconditional PNG is the light one under
		     `no-preference` only, or it would match in dark mode too and win.
		     `apple-touch-icon` has no SVG form. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon.png"
			media="(prefers-color-scheme: no-preference)"
		/>
		<link
			rel="apple-touch-icon"
			href="/apple-touch-icon.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="apple-touch-icon"
			href="/apple-touch-icon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>
		<!-- Apply the saved theme before first paint to avoid a flash. The nonce is what the
		     Content-Security-Policy lets it run by. -->
		<script nonce="%sveltekit.nonce%">
			(function () {
				try {
					var d = localStorage.getItem('darkmode');
					if (d === 'true' || (d === null && matchMedia('(prefers-color-scheme: dark)').matches))
						document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
