name: Images

# The API and frontend images, for amd64 and arm64, so an install can pull them instead of
# compiling Rust on the server. main publishes `main` and `sha-<commit>`; a `v1.2.3` tag
# publishes `1.2.3`, `1.2` and `latest`. docker-compose.yml names them.
#
# Each architecture builds on its own native runner (emulating arm64 turns the Rust build
# into hours) and pushes by digest; the merge job then puts one tag over both.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR wants it lowercase.
  PREFIX: ghcr.io/wormholesystems/wormholesystems

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    # A fork has nowhere to push these.
    if: github.repository_owner == 'WormholeSystems'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
        arch: [amd64, arm64]
        include:
          - image: api
            context: .
          - image: web
            context: frontend
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The dependency layers are most of the API's build time; this keeps them.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Put each tag over both architectures
        working-directory: digests
        env:
          IMAGE: ${{ env.PREFIX }}-${{ matrix.image }}
        run: |
          # shellcheck disable=SC2046 # one argument per tag and per digest, split on purpose
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
