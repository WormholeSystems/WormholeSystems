name: Release wsctl

# Cut a release by pushing a tag:  git tag wsctl-v0.1.0 && git push --tags
# install.sh pulls the matching binary from the release this produces, and checks it
# against the SHA256SUMS published beside it.
on:
  push:
    tags: ["wsctl-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners where there is one: a binary built on the platform it runs on
          # is one less thing to be wrong about.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Intel Macs are cross-compiled on the Apple silicon runner. GitHub's Intel
          # images are being retired, and one queued job would hold up the release of the
          # Linux binaries this exists for; Apple's toolchain builds for both from either.
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p wsctl --target ${{ matrix.target }}

      - name: Name it after its target
        run: mv "target/${{ matrix.target }}/release/wsctl" "wsctl-${{ matrix.target }}"

      - name: Check it runs
        if: ${{ !matrix.cross }}
        run: ./wsctl-${{ matrix.target }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: wsctl-${{ matrix.target }}
          path: wsctl-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum wsctl-* > SHA256SUMS
          cat SHA256SUMS

      # The desktop app releases from this repo too: notes start at the previous wsctl tag,
      # and this one is marked latest, which is what install.sh downloads.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          previous="$(git tag -l 'wsctl-v*' --sort=-v:refname | grep -vx "$TAG" | head -1)"
          gh release create "$TAG" dist/wsctl-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --latest \
            --generate-notes ${previous:+--notes-start-tag "$previous"}
