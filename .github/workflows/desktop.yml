name: Desktop

# The desktop app (desktop/), built and packaged for Linux, Windows and macOS on every change
# to it; a `desktop-v1.2.3` tag also publishes the packages as a GitHub release. Packages
# are cargo-packager's: an NSIS setup for Windows, a DMG for macOS, an AppImage for Linux,
# plus a portable exe and a plain binary. On a tag the update bundles are signed with
# DESKTOP_UPDATER_PRIVATE_KEY and listed in the release's latest.json, which the app reads
# to update itself; DESKTOP_UPDATER_PUBKEY is compiled in to check them. Code is not signed
# (macOS gets an ad-hoc signature), so SmartScreen and Gatekeeper ask before the first start.
#
# wsctl releases from this repo too, and its install.sh downloads "the latest release", so
# a desktop release is never marked latest.
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      # Compiled into every build, so any of them can check an update's signature.
      WS_UPDATER_PUBKEY: ${{ vars.DESKTOP_UPDATER_PUBKEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary runs on distros with an older glibc.
          - target: linux-x86_64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            updater: linux-x86_64
          - target: windows-x86_64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            updater: windows-x86_64
          - target: macos-arm64
            runner: macos-latest
            triple: aarch64-apple-darwin
            updater: macos-aarch64
          # Intel Macs are cross-compiled on the Apple silicon runner, as wsctl's are.
          - target: macos-x86_64
            runner: macos-latest
            triple: x86_64-apple-darwin
            updater: macos-x86_64
            cross: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}

      # GPUI's windowing and fonts on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libfuse2

      - name: Version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* && "${GITHUB_REF_NAME#desktop-v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !matrix.cross }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}

      # Built from crates.io, since it handles the signing key.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package
        env:
          OUT: target/${{ matrix.triple }}/release
          NAME: wormholesystems-${{ matrix.target }}
          CARGO_BUILD_TARGET: ${{ matrix.triple }}
          # The AppImage tooling is an AppImage itself, and runners have no FUSE mount.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.DESKTOP_UPDATER_PRIVATE_KEY || '' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          case "$RUNNER_OS" in
            Linux) formats=appimage ;;
            Windows) formats=nsis ;;
            macOS) formats=app,dmg ;;
          esac
          # Only a release signs: the signature is what makes a bundle an update.
          if [ -n "$SIGNING_KEY" ]; then
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$SIGNING_KEY"
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
          fi
          cargo packager --release --target ${{ matrix.triple }} --formats "$formats" --out-dir packages
          ls -la packages

          mkdir -p dist
          # One name per platform, so the download links in latest.json are predictable.
          put() { cp "$1" "dist/$2"; [ -f "$1.sig" ] && cp "$1.sig" "dist/$2.sig"; true; }
          case "$RUNNER_OS" in
            Linux)
              tar -czf "dist/$NAME.tar.gz" -C "$OUT" wormholesystems
              put "$(ls packages/*.AppImage)" "$NAME.AppImage"
              bundle="$NAME.AppImage"; format=appimage
              ;;
            Windows)
              7z a -bd "dist/$NAME-portable.zip" "./$OUT/wormholesystems.exe" > /dev/null
              put "$(ls packages/*-setup.exe)" "$NAME-setup.exe"
              bundle="$NAME-setup.exe"; format=nsis
              ;;
            macOS)
              put "$(ls packages/*.dmg)" "$NAME.dmg"
              # The signer packs the .app into a tarball for the updater.
              if [ -f packages/WormholeSystems.app.tar.gz ]; then
                put packages/WormholeSystems.app.tar.gz "$NAME.app.tar.gz"
              fi
              bundle="$NAME.app.tar.gz"; format=app
              ;;
          esac

          if [ -n "$SIGNING_KEY" ]; then
            if [ ! -f "dist/$bundle.sig" ]; then
              echo "::error::no signed update bundle for ${{ matrix.updater }}"
              exit 1
            fi
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$bundle"
            jq -n --rawfile sig "dist/$bundle.sig" --arg url "$url" --arg format "$format" \
              '{signature: ($sig | rtrimstr("\n")), url: $url, format: $format}' \
              > "dist/updater-${{ matrix.updater }}.json"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: wormholesystems-${{ matrix.target }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # What the app reads to update itself: every platform's signed bundle.
      - name: Update manifest
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jq -n --arg version "${TAG#desktop-v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $date, platforms: (reduce inputs as $p ({}; . + $p))}' \
            $(for f in updater-*.json; do
                key="${f#updater-}"; key="${key%.json}"
                jq -c --arg k "$key" '{($k): .}' "$f" > "platform-$key.json"
                echo "platform-$key.json"
              done) > latest.json
          rm -f updater-*.json platform-*.json
          cat latest.json

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum wormholesystems-* > SHA256SUMS
          cat SHA256SUMS

      # Notes from the previous desktop tag, not whichever tag came last: that could be
      # a wsctl one.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(git tag -l 'desktop-v*' --sort=-v:refname | grep -vx "$TAG" | head -1)"
          version="${TAG#desktop-v}"
          # 0.1.0-alpha.1 and the like go out as pre-releases.
          pre=()
          [[ "$version" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Desktop $version" \
            --latest=false "${pre[@]}" \
            --generate-notes ${previous:+--notes-start-tag "$previous"}
