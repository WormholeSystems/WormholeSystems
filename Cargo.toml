[package]
name = "wormholesystems"
version = "0.1.0"
edition = "2024"
# sqlx 0.9 (and its CLI) require rustc >= 1.94.
rust-version = "1.94"

# `wsctl` is a workspace member rather than another binary here: it pulls in a prompt
# toolkit the server has no use for, and `default-members` keeps it out of the image build.
[workspace]
members = ["wsctl"]
default-members = ["."]

[dependencies]
# Web server
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
# Compressing API responses. A map read is tens of kilobytes of repetitive JSON.
tower-http = { version = "0.6", features = ["compression-gzip", "compression-zstd"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

# Domain
reqwest = { version = "0.13.4", features = ["blocking", "json", "form"] }
jsonwebtoken = "9"
zip = "8.6.0"
# EVE Ref's killmail archives. `static` builds libbz2 rather than relying on the host's.
tar = { version = "0.4", default-features = false }
bzip2 = { version = "0.6", features = ["static"] }
dotenvy = "0.15"
# Logging. `RUST_LOG` picks the level per module, `info` when unset.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Only for a cookie's Max-Age; already in the tree through the cookie crate.
time = { version = "0.3", default-features = false }
# default-features off drops `clock` — we only use DateTime<Utc> as a type, never now().
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    # Reads `sqlx.toml`, which is where each Postgres enum type says which Rust type it is.
    "sqlx-toml",
    "chrono",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `no-serde-warnings`: ts-rs warns on any serde attribute it does not itself understand,
# and it does not understand `deserialize_with`. Thirteen fields use it for the
# absent-versus-null distinction, which changes how a value is read and not what it looks
# like on the wire, so the generated types are right (`field?: T | null`) and the warnings
# were thirteen per build saying nothing. The cost: a future attribute that really does
# change the wire shape will now be ignored quietly, so check the generated type when you
# add one.
ts-rs = { version = "12.0.1", features = ["chrono-impl", "no-serde-warnings"] }
# The OpenAPI document, built from the same handlers and wire types the frontend uses.
utoipa = { version = "5", features = ["chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
# Verifying Discord's signature on interaction webhooks.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
hex = "0.4.3"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# A real WebSocket client, for the tests that drive the map socket over a socket.
tokio-tungstenite = "0.29"
futures-util = "0.3"
