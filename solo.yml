name: wormholesystems
icon: null
processes:
  # Long-running dev services — start with the stack.
  Postgres:
    command: docker compose up db
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  API:
    command: cargo run
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed:
      - src/**/*.rs
      - Cargo.toml
    env: {}
  Frontend:
    command: npm run dev
    working_dir: frontend
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}

  # The whole stack in Docker, built from the working tree: Postgres, API, frontend and
  # Caddy on http://localhost:8080. Shares the `db` container with the Postgres process
  # above, and stays off :80, :3000 and :5173 so the host dev stack can keep running.
  Full stack (Docker):
    command: docker compose up --build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"

  # One-shot dev tasks — trigger manually from the process list.
  Format:
    command: cargo fmt --all
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Lint (Clippy):
    command: cargo clippy --all-targets
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Test:
    command: cargo test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Check:
    command: cargo check --all-targets
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  E2E:
    command: npm run test:e2e
    working_dir: frontend
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Export TS types:
    command: cargo test export_bindings
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Export OpenAPI document:
    command: cargo test --test openapi
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Seed SDE:
    command: cargo run -- seed
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
